server {
    listen 80;
    listen [::]:80;
    server_name xiaoxi.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /srv/xiaoxi/site;
        try_files $uri =404;
    }
    location / { return 301 https://xiaoxi.example.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xiaoxi.example.com;
    ssl_certificate /etc/letsencrypt/live/xiaoxi.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiaoxi.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:XiaoxiTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    root /srv/xiaoxi/site;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
    location /evidence/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\.(?!well-known/) { deny all; }
}
